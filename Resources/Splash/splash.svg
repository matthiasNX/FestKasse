<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect x="0" y="0" width="456" height="456" fill="#2E7D32"/>

  <!-- Cash register body -->
  <rect x="96" y="192" width="264" height="176" rx="20" ry="20" fill="white" opacity="0.95"/>

  <!-- Screen panel -->
  <rect x="110" y="112" width="236" height="102" rx="14" ry="14" fill="white" opacity="0.95"/>

  <!-- Screen inner display -->
  <rect x="126" y="126" width="204" height="74" rx="8" ry="8" fill="#2E7D32" opacity="0.25"/>

  <!-- Euro sign on screen -->
  <text x="228" y="178" font-size="52" text-anchor="middle" dominant-baseline="middle"
        fill="white" font-family="Arial, sans-serif" font-weight="900">€ 0.00</text>

  <!-- Keypad rows -->
  <!-- Row 1 -->
  <rect x="120" y="222" width="40" height="28" rx="7" fill="#2E7D32" opacity="0.55"/>
  <rect x="172" y="222" width="40" height="28" rx="7" fill="#2E7D32" opacity="0.55"/>
  <rect x="224" y="222" width="40" height="28" rx="7" fill="#2E7D32" opacity="0.55"/>
  <rect x="276" y="222" width="40" height="28" rx="7" fill="#2E7D32" opacity="0.55"/>

  <!-- Row 2 -->
  <rect x="120" y="260" width="40" height="28" rx="7" fill="#2E7D32" opacity="0.55"/>
  <rect x="172" y="260" width="40" height="28" rx="7" fill="#2E7D32" opacity="0.55"/>
  <rect x="224" y="260" width="40" height="28" rx="7" fill="#2E7D32" opacity="0.55"/>
  <rect x="276" y="260" width="40" height="28" rx="7" fill="#2E7D32" opacity="0.55"/>

  <!-- Enter / pay button -->
  <rect x="120" y="298" width="196" height="34" rx="10" fill="white" opacity="0.85"/>

  <!-- Receipt strip -->
  <rect x="198" y="368" width="60" height="24" rx="5" fill="white" opacity="0.9"/>
  <rect x="210" y="392" width="36" height="8" rx="3" fill="white" opacity="0.5"/>

  <!-- App title -->
  <text x="228" y="440" font-size="38" text-anchor="middle" dominant-baseline="auto"
        fill="white" font-family="Arial, sans-serif" font-weight="bold" opacity="0.95">FestKasse</text>

</svg>
